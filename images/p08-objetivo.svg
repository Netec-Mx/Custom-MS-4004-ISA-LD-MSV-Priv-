<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="892" viewBox="0 0 1280 892">
<defs><style><![CDATA[text { font-family: Arial, Helvetica, sans-serif; }]]></style></defs>
<rect width="100%" height="100%" fill="#f5f8fb"/>
<rect x="0" y="0" width="100%" height="88" fill="#0b3a63"/>
<text x="36" y="38" font-size="26" font-weight="700" fill="#ffffff">Práctica 08</text>
<text x="36" y="70" font-size="28" font-weight="700" fill="#ffffff">Identificar cambios y novedades relevantes en la organización</text>
<text x="1244" y="40" text-anchor="end" font-size="18" font-weight="700" fill="#b7d4ea">MS-4004 · ISA INTERCOLOMBIA</text>
<text x="36" y="126" font-size="26" font-weight="700" fill="#0b3a63">Objetivo y flujo de trabajo</text>
<rect x="36" y="146" rx="18" ry="18" width="1208" height="215" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="180" font-size="24" font-weight="700" fill="#0b3a63">Entradas</text>
<text x="64" y="214" font-size="18" fill="#1d2b36">• Seis correos .eml sobre operación, seguridad, bienestar,</text>
<text x="64" y="238" font-size="18" fill="#1d2b36">  consignaciones, prioridades y sostenibilidad.</text>
<text x="64" y="270" font-size="18" fill="#1d2b36">• Escenario: sintetizar una semana de novedades organizativas.</text>
<text x="64" y="302" font-size="18" fill="#1d2b36">• Herramienta: Copilot para resumir y profundizar.</text>
<rect x="36" y="387" rx="18" ry="18" width="1208" height="215" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="421" font-size="24" font-weight="700" fill="#0b3a63">Trabajo con Copilot</text>
<text x="64" y="455" font-size="18" fill="#1d2b36">• Agrupar las novedades por temática y nivel de relevancia.</text>
<text x="64" y="487" font-size="18" fill="#1d2b36">• Profundizar en una temática y revisar sus implicaciones por</text>
<text x="64" y="511" font-size="18" fill="#1d2b36">  área.</text>
<text x="64" y="543" font-size="18" fill="#1d2b36">• Generar una síntesis útil para alguien que estuvo ausente.</text>
<rect x="36" y="628" rx="18" ry="18" width="1208" height="184" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="662" font-size="24" font-weight="700" fill="#0b3a63">Validar</text>
<text x="64" y="696" font-size="18" fill="#1d2b36">• Separar cambios importantes de comunicaciones contextuales o</text>
<text x="64" y="720" font-size="18" fill="#1d2b36">  recurrentes.</text>
<text x="64" y="752" font-size="18" fill="#1d2b36">• Mantener referencia a las fuentes originales.</text>
<rect x="36" y="848" rx="10" ry="10" width="1208" height="34" fill="#dcecf7"/>
<text x="52" y="870" font-size="15" fill="#3a5a76">Imagen de apoyo de la guía práctica. Resume entradas, flujo de trabajo, validación y resultados esperados.</text>
</svg>