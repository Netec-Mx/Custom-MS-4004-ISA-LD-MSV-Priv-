<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="916" viewBox="0 0 1280 916">
<defs><style><![CDATA[text { font-family: Arial, Helvetica, sans-serif; }]]></style></defs>
<rect width="100%" height="100%" fill="#f5f8fb"/>
<rect x="0" y="0" width="100%" height="88" fill="#0b3a63"/>
<text x="36" y="38" font-size="26" font-weight="700" fill="#ffffff">Práctica 14</text>
<text x="36" y="70" font-size="28" font-weight="700" fill="#ffffff">Del entorno a la decisión</text>
<text x="1244" y="40" text-anchor="end" font-size="18" font-weight="700" fill="#b7d4ea">MS-4004 · ISA INTERCOLOMBIA</text>
<text x="36" y="126" font-size="26" font-weight="700" fill="#0b3a63">Objetivo y flujo de trabajo</text>
<rect x="36" y="146" rx="18" ry="18" width="1208" height="215" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="180" font-size="24" font-weight="700" fill="#0b3a63">Entradas</text>
<text x="64" y="214" font-size="18" fill="#1d2b36">• Caso_Monitoreo_Predictivo_Activos.docx.</text>
<text x="64" y="246" font-size="18" fill="#1d2b36">• Datos_Activos_MPA.xlsx.</text>
<text x="64" y="278" font-size="18" fill="#1d2b36">• Herramientas: Investigador, Analista, Copilot en Excel, Word y</text>
<text x="64" y="302" font-size="18" fill="#1d2b36">  PowerPoint.</text>
<rect x="36" y="387" rx="18" ry="18" width="1208" height="215" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="421" font-size="24" font-weight="700" fill="#0b3a63">Trabajo integral</text>
<text x="64" y="455" font-size="18" fill="#1d2b36">• Investigar evidencia externa y contrastarla con el caso.</text>
<text x="64" y="487" font-size="18" fill="#1d2b36">• Analizar datos, generar tabla dinámica y gráfico en Excel.</text>
<text x="64" y="519" font-size="18" fill="#1d2b36">• Construir una presentación ejecutiva y revisarla antes de</text>
<text x="64" y="543" font-size="18" fill="#1d2b36">  decidir.</text>
<rect x="36" y="628" rx="18" ry="18" width="1208" height="208" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="662" font-size="24" font-weight="700" fill="#0b3a63">Validar</text>
<text x="64" y="696" font-size="18" fill="#1d2b36">• Separar evidencia externa, información del caso y datos no</text>
<text x="64" y="720" font-size="18" fill="#1d2b36">  confirmados.</text>
<text x="64" y="752" font-size="18" fill="#1d2b36">• La presentación debe sostener cada afirmación con investigación</text>
<text x="64" y="776" font-size="18" fill="#1d2b36">  o datos.</text>
<rect x="36" y="872" rx="10" ry="10" width="1208" height="34" fill="#dcecf7"/>
<text x="52" y="894" font-size="15" fill="#3a5a76">Imagen de apoyo de la guía práctica. Resume entradas, flujo de trabajo, validación y resultados esperados.</text>
</svg>