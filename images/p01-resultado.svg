<text x="36" y="38" font-size="26" font-weight="700" fill="#ffffff">Práctica 01</text>
<text x="36" y="70" font-size="28" font-weight="700" fill="#ffffff">Investigación profunda para una decisión</text>
<text x="1244" y="40" text-anchor="end" font-size="18" font-weight="700" fill="#b7d4ea">MS-4004 · ISA INTERCOLOMBIA</text>
<text x="36" y="126" font-size="26" font-weight="700" fill="#0b3a63">Resultado esperado y entregable</text>
<rect x="36" y="146" rx="18" ry="18" width="1208" height="215" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="180" font-size="24" font-weight="700" fill="#0b3a63">Debe obtener</text>
<text x="64" y="214" font-size="18" fill="#1d2b36">• Resumen con hallazgos, oportunidades y riesgos.</text>
<text x="64" y="246" font-size="18" fill="#1d2b36">• Contraste explícito entre evidencia externa y prioridades</text>
<text x="64" y="270" font-size="18" fill="#1d2b36">  internas.</text>
<text x="64" y="302" font-size="18" fill="#1d2b36">• Preguntas pendientes y contradicciones detectadas.</text>
<rect x="36" y="387" rx="18" ry="18" width="1208" height="129" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="421" font-size="24" font-weight="700" fill="#0b3a63">Entregable</text>
<text x="64" y="455" font-size="18" fill="#1d2b36">• Reporte_Investigacion_[INICIALES].docx</text>
<rect x="36" y="542" rx="18" ry="18" width="1208" height="191" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="576" font-size="24" font-weight="700" fill="#0b3a63">Criterios de calidad</text>
<text x="64" y="610" font-size="18" fill="#1d2b36">• Citas verificables.</text>
<text x="64" y="642" font-size="18" fill="#1d2b36">• No mezclar supuestos con hechos.</text>
<text x="64" y="674" font-size="18" fill="#1d2b36">• Conclusiones útiles para decidir.</text>
<rect x="36" y="769" rx="10" ry="10" width="1208" height="34" fill="#dcecf7"/>
<text x="52" y="791" font-size="15" fill="#3a5a76">Imagen de apoyo de la guía práctica. Resume entradas, flujo de trabajo, validación y resultados esperados.</text>
