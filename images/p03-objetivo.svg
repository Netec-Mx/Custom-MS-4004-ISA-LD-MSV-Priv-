<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="868" viewBox="0 0 1280 868">
<defs><style><![CDATA[text { font-family: Arial, Helvetica, sans-serif; }]]></style></defs>
<rect width="100%" height="100%" fill="#f5f8fb"/>
<rect x="0" y="0" width="100%" height="88" fill="#0b3a63"/>
<text x="36" y="38" font-size="26" font-weight="700" fill="#ffffff">Práctica 03</text>
<text x="36" y="70" font-size="28" font-weight="700" fill="#ffffff">Cuestionar una posible decisión</text>
<text x="1244" y="40" text-anchor="end" font-size="18" font-weight="700" fill="#b7d4ea">MS-4004 · ISA INTERCOLOMBIA</text>
<text x="36" y="126" font-size="26" font-weight="700" fill="#0b3a63">Objetivo y flujo de trabajo</text>
<rect x="36" y="146" rx="18" ry="18" width="1208" height="215" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="180" font-size="24" font-weight="700" fill="#0b3a63">Entradas</text>
<text x="64" y="214" font-size="18" fill="#1d2b36">• Propuesta_Coordinacion_Intervencion.docx.</text>
<text x="64" y="246" font-size="18" fill="#1d2b36">• Necesidad: revisar una decisión antes de presentarla.</text>
<text x="64" y="278" font-size="18" fill="#1d2b36">• Herramienta central: Entrenador de ideas / Coaching de</text>
<text x="64" y="302" font-size="18" fill="#1d2b36">  razonamiento.</text>
<rect x="36" y="387" rx="18" ry="18" width="1208" height="191" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="421" font-size="24" font-weight="700" fill="#0b3a63">Trabajo con Copilot</text>
<text x="64" y="455" font-size="18" fill="#1d2b36">• Pedir objeciones desde varias áreas afectadas.</text>
<text x="64" y="487" font-size="18" fill="#1d2b36">• Identificar supuestos débiles, riesgos y dependencias.</text>
<text x="64" y="519" font-size="18" fill="#1d2b36">• Refinar la propuesta con recomendaciones y aspectos por validar.</text>
<rect x="36" y="604" rx="18" ry="18" width="1208" height="184" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="638" font-size="24" font-weight="700" fill="#0b3a63">Validar</text>
<text x="64" y="672" font-size="18" fill="#1d2b36">• Las objeciones deben provenir de áreas concretas.</text>
<text x="64" y="704" font-size="18" fill="#1d2b36">• La versión refinada debe mostrar cambios frente a la propuesta</text>
<text x="64" y="728" font-size="18" fill="#1d2b36">  inicial.</text>
<rect x="36" y="824" rx="10" ry="10" width="1208" height="34" fill="#dcecf7"/>
<text x="52" y="846" font-size="15" fill="#3a5a76">Imagen de apoyo de la guía práctica. Resume entradas, flujo de trabajo, validación y resultados esperados.</text>
