<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="916" viewBox="0 0 1280 916">
<defs><style><![CDATA[text { font-family: Arial, Helvetica, sans-serif; }]]></style></defs>
<rect width="100%" height="100%" fill="#f5f8fb"/>
<rect x="0" y="0" width="100%" height="88" fill="#0b3a63"/>
<text x="36" y="38" font-size="26" font-weight="700" fill="#ffffff">Práctica 12</text>
<text x="36" y="70" font-size="28" font-weight="700" fill="#ffffff">Diseñar un agente para una necesidad recurrente</text>
<text x="1244" y="40" text-anchor="end" font-size="18" font-weight="700" fill="#b7d4ea">MS-4004 · ISA INTERCOLOMBIA</text>
<text x="36" y="126" font-size="26" font-weight="700" fill="#0b3a63">Objetivo y flujo de trabajo</text>
<rect x="36" y="146" rx="18" ry="18" width="1208" height="215" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="180" font-size="24" font-weight="700" fill="#0b3a63">Entradas</text>
<text x="64" y="214" font-size="18" fill="#1d2b36">• Escenario de Laura con seis personas y cinco iniciativas</text>
<text x="64" y="238" font-size="18" fill="#1d2b36">  semanales.</text>
<text x="64" y="270" font-size="18" fill="#1d2b36">• Seis criterios de revisión y tres reglas de prioridad.</text>
<text x="64" y="302" font-size="18" fill="#1d2b36">• Objetivo: definir un agente especializado de seguimiento.</text>
<rect x="36" y="387" rx="18" ry="18" width="1208" height="239" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="421" font-size="24" font-weight="700" fill="#0b3a63">Trabajo de diseño</text>
<text x="64" y="455" font-size="18" fill="#1d2b36">• Comparar Copilot Chat, agentes de plantilla y agente</text>
<text x="64" y="479" font-size="18" fill="#1d2b36">  personalizado.</text>
<text x="64" y="511" font-size="18" fill="#1d2b36">• Definir propósito, entrada, salida, prioridades y límites.</text>
<text x="64" y="543" font-size="18" fill="#1d2b36">• Redactar el prompt completo para crear el agente en la práctica</text>
<text x="64" y="567" font-size="18" fill="#1d2b36">  13.</text>
<rect x="36" y="652" rx="18" ry="18" width="1208" height="184" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="686" font-size="24" font-weight="700" fill="#0b3a63">Validar</text>
<text x="64" y="720" font-size="18" fill="#1d2b36">• Debe cubrir datos faltantes, contradicciones y solicitudes fuera</text>
<text x="64" y="744" font-size="18" fill="#1d2b36">  del alcance.</text>
<text x="64" y="776" font-size="18" fill="#1d2b36">• No debe tomar decisiones por la persona usuaria.</text>
<rect x="36" y="872" rx="10" ry="10" width="1208" height="34" fill="#dcecf7"/>
<text x="52" y="894" font-size="15" fill="#3a5a76">Imagen de apoyo de la guía práctica. Resume entradas, flujo de trabajo, validación y resultados esperados.</text>
</svg>