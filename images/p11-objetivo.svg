<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="916" viewBox="0 0 1280 916">
<defs><style><![CDATA[text { font-family: Arial, Helvetica, sans-serif; }]]></style></defs>
<rect width="100%" height="100%" fill="#f5f8fb"/>
<rect x="0" y="0" width="100%" height="88" fill="#0b3a63"/>
<text x="36" y="38" font-size="26" font-weight="700" fill="#ffffff">Práctica 11</text>
<text x="36" y="70" font-size="28" font-weight="700" fill="#ffffff">Optimizar una solicitud compleja con Prompt Coach</text>
<text x="1244" y="40" text-anchor="end" font-size="18" font-weight="700" fill="#b7d4ea">MS-4004 · ISA INTERCOLOMBIA</text>
<text x="36" y="126" font-size="26" font-weight="700" fill="#0b3a63">Objetivo y flujo de trabajo</text>
<rect x="36" y="146" rx="18" ry="18" width="1208" height="215" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="180" font-size="24" font-weight="700" fill="#0b3a63">Entradas</text>
<text x="64" y="214" font-size="18" fill="#1d2b36">• Plan, matriz de riesgos e informe de avance del proyecto</text>
<text x="64" y="238" font-size="18" fill="#1d2b36">  INT-MDV-2026.</text>
<text x="64" y="270" font-size="18" fill="#1d2b36">• Prompt ambiguo inicial sobre riesgos y acciones.</text>
<text x="64" y="302" font-size="18" fill="#1d2b36">• Herramientas: Copilot Chat y agente Prompt Coach.</text>
<rect x="36" y="387" rx="18" ry="18" width="1208" height="239" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="421" font-size="24" font-weight="700" fill="#0b3a63">Trabajo con Prompt Coach</text>
<text x="64" y="455" font-size="18" fill="#1d2b36">• Ejecutar primero la solicitud ambigua para observar el</text>
<text x="64" y="479" font-size="18" fill="#1d2b36">  resultado.</text>
<text x="64" y="511" font-size="18" fill="#1d2b36">• Pedir diagnóstico en objetivo, contexto, fuentes, criterios y</text>
<text x="64" y="535" font-size="18" fill="#1d2b36">  formato.</text>
<text x="64" y="567" font-size="18" fill="#1d2b36">• Crear una versión mejorada y otra síntesis dirigida a liderazgo.</text>
<rect x="36" y="652" rx="18" ry="18" width="1208" height="184" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="686" font-size="24" font-weight="700" fill="#0b3a63">Validar</text>
<text x="64" y="720" font-size="18" fill="#1d2b36">• Comparar precisión, estructura, profundidad y utilidad.</text>
<text x="64" y="752" font-size="18" fill="#1d2b36">• Distinguir mejoras por mejores instrucciones y por uso de</text>
<text x="64" y="776" font-size="18" fill="#1d2b36">  fuentes.</text>
<rect x="36" y="872" rx="10" ry="10" width="1208" height="34" fill="#dcecf7"/>
<text x="52" y="894" font-size="15" fill="#3a5a76">Imagen de apoyo de la guía práctica. Resume entradas, flujo de trabajo, validación y resultados esperados.</text>
