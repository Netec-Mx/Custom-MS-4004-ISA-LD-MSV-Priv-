<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940">
<defs><style><![CDATA[text { font-family: Arial, Helvetica, sans-serif; }]]></style></defs>
<rect width="100%" height="100%" fill="#f5f8fb"/>
<rect x="0" y="0" width="100%" height="88" fill="#0b3a63"/>
<text x="36" y="38" font-size="26" font-weight="700" fill="#ffffff">Práctica 01</text>
<text x="36" y="70" font-size="28" font-weight="700" fill="#ffffff">Investigación profunda para una decisión</text>
<text x="1244" y="40" text-anchor="end" font-size="18" font-weight="700" fill="#b7d4ea">MS-4004 · ISA INTERCOLOMBIA</text>
<text x="36" y="126" font-size="26" font-weight="700" fill="#0b3a63">Objetivo y flujo de trabajo</text>
<rect x="36" y="146" rx="18" ry="18" width="1208" height="239" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="180" font-size="24" font-weight="700" fill="#0b3a63">Entradas</text>
<text x="64" y="214" font-size="18" fill="#1d2b36">• Prioridades internas 2027 del caso ISA INTERCOLOMBIA.</text>
<text x="64" y="246" font-size="18" fill="#1d2b36">• Tema a investigar: mantenimiento predictivo con IA en</text>
<text x="64" y="270" font-size="18" fill="#1d2b36">  transmisión de energía.</text>
<text x="64" y="302" font-size="18" fill="#1d2b36">• Necesidad: contrastar evidencia externa con prioridades del</text>
<text x="64" y="326" font-size="18" fill="#1d2b36">  negocio.</text>
<rect x="36" y="411" rx="18" ry="18" width="1208" height="239" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="445" font-size="24" font-weight="700" fill="#0b3a63">Trabajo con Investigador</text>
<text x="64" y="479" font-size="18" fill="#1d2b36">• Abrir el agente Investigador y lanzar una búsqueda multifuente.</text>
<text x="64" y="511" font-size="18" fill="#1d2b36">• Pedir evolución, beneficios, riesgos, madurez y ejemplos de</text>
<text x="64" y="535" font-size="18" fill="#1d2b36">  adopción.</text>
<text x="64" y="567" font-size="18" fill="#1d2b36">• Cruzar hallazgos con el documento interno y detectar</text>
<text x="64" y="591" font-size="18" fill="#1d2b36">  contradicciones.</text>
<rect x="36" y="676" rx="18" ry="18" width="1208" height="184" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="710" font-size="24" font-weight="700" fill="#0b3a63">Validar</text>
<text x="64" y="744" font-size="18" fill="#1d2b36">• Toda afirmación importante debe mostrar su fuente.</text>
<text x="64" y="776" font-size="18" fill="#1d2b36">• Diferenciar evidencia sólida, tendencias y vacíos de</text>
<text x="64" y="800" font-size="18" fill="#1d2b36">  información.</text>
<rect x="36" y="896" rx="10" ry="10" width="1208" height="34" fill="#dcecf7"/>
<text x="52" y="918" font-size="15" fill="#3a5a76">Imagen de apoyo de la guía práctica. Resume entradas, flujo de trabajo, validación y resultados esperados.</text>
</svg>