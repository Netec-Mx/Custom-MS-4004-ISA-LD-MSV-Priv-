<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="916" viewBox="0 0 1280 916">
<defs><style><![CDATA[text { font-family: Arial, Helvetica, sans-serif; }]]></style></defs>
<rect width="100%" height="100%" fill="#f5f8fb"/>
<rect x="0" y="0" width="100%" height="88" fill="#0b3a63"/>
<text x="36" y="38" font-size="26" font-weight="700" fill="#ffffff">Práctica 13</text>
<text x="36" y="70" font-size="28" font-weight="700" fill="#ffffff">Crear, probar y ajustar el agente personalizado</text>
<text x="1244" y="40" text-anchor="end" font-size="18" font-weight="700" fill="#b7d4ea">MS-4004 · ISA INTERCOLOMBIA</text>
<text x="36" y="126" font-size="26" font-weight="700" fill="#0b3a63">Objetivo y flujo de trabajo</text>
<rect x="36" y="146" rx="18" ry="18" width="1208" height="215" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="180" font-size="24" font-weight="700" fill="#0b3a63">Entradas</text>
<text x="64" y="214" font-size="18" fill="#1d2b36">• Diseno_Agente.docx generado en la práctica 12.</text>
<text x="64" y="246" font-size="18" fill="#1d2b36">• Casos_Prueba_Agente.docx con reporte completo, incompleto y</text>
<text x="64" y="270" font-size="18" fill="#1d2b36">  contradictorio.</text>
<text x="64" y="302" font-size="18" fill="#1d2b36">• Entorno Microsoft 365 Copilot &gt; Nuevo agente &gt; Describir.</text>
<rect x="36" y="387" rx="18" ry="18" width="1208" height="239" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="421" font-size="24" font-weight="700" fill="#0b3a63">Trabajo con el agente</text>
<text x="64" y="455" font-size="18" fill="#1d2b36">• Crear el agente usando lenguaje natural, sin diseño manual.</text>
<text x="64" y="487" font-size="18" fill="#1d2b36">• Ejecutar cuatro pruebas: tres casos y una solicitud fuera de</text>
<text x="64" y="511" font-size="18" fill="#1d2b36">  propósito.</text>
<text x="64" y="543" font-size="18" fill="#1d2b36">• Ajustar las instrucciones y comparar luego con Copilot Chat</text>
<text x="64" y="567" font-size="18" fill="#1d2b36">  general.</text>
<rect x="36" y="652" rx="18" ry="18" width="1208" height="184" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
<text x="58" y="686" font-size="24" font-weight="700" fill="#0b3a63">Validar</text>
<text x="64" y="720" font-size="18" fill="#1d2b36">• El agente debe mantener estructura, prioridades y límites.</text>
<text x="64" y="752" font-size="18" fill="#1d2b36">• Debe detectar contradicciones y pedir aclaraciones cuando falten</text>
<text x="64" y="776" font-size="18" fill="#1d2b36">  datos.</text>
<rect x="36" y="872" rx="10" ry="10" width="1208" height="34" fill="#dcecf7"/>
<text x="52" y="894" font-size="15" fill="#3a5a76">Imagen de apoyo de la guía práctica. Resume entradas, flujo de trabajo, validación y resultados esperados.</text>
</svg>